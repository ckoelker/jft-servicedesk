# Die Konfiguration des ServiceDesk - noch ist keine einzige Zeile aktiv.
#
# Aufgebaut wie die pom.xml: jeder Block der Schulung nimmt in seinem Abschnitt
# die Kommentarzeichen weg. Nichts abtippen.
