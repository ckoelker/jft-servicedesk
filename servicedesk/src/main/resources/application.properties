# Umgebungsvariablen QUARKUS_LANGCHAIN4J_OPENAI_API_KEY.


# --- B10: Quarkus ---

# Port, Begruessungsbanner und Gespraechigkeit der eigenen Klassen.
# quarkus.http.port=8080
# quarkus.banner.enabled=false
# quarkus.log.category."de.netzfactor".level=INFO


# --- B12: Persistenz ---

# Der Anschluss an die Postgres-Datenbank aus docker-compose.yml.
# quarkus.datasource.db-kind=postgresql
# quarkus.datasource.username=servicedesk
# quarkus.datasource.password=servicedesk
# quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/servicedesk

# Wir haben schon eine Datenbank, also soll Quarkus keine eigene hochfahren.
# quarkus.devservices.enabled=false

# Hibernate darf das Schema nur pruefen, nicht anlegen: die Tabellen kommen aus datenbank/.
# quarkus.hibernate-orm.schema-management.strategy=validate

# Damit aus dem Feld gemeldetAm die Spalte gemeldet_am wird.
# quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy


# --- B16: KI ---

# Welche Modelle wir bei OpenAI ansprechen und wie lange wir auf sie warten.
# quarkus.langchain4j.openai.chat-model.model-name=gpt-5.4-mini
# quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
# quarkus.langchain4j.openai.timeout=60s

# So viele Nachrichten behaelt ein Gespraech im Gedaechtnis.
# quarkus.langchain4j.chat-memory.memory-window.max-messages=20


# --- B17: Handbuchsuche ---

# Der Vektorspeicher in derselben Datenbank; die Dimension gehoert zum Embedding-Modell oben.
# quarkus.langchain4j.pgvector.dimension=1536
# quarkus.langchain4j.pgvector.create-table=true

# Wo die Handbuchseiten liegen, die eingelesen werden.
# servicedesk.handbuch.pfad=../handbuch
