# --- HTTP ---

# Der ServiceDesk auf 8080, das Lagersystem daneben auf 8082.
quarkus.http.port=8080

# --- Datenbank ---

# Postgres, wie er aus docker-compose.yml laeuft.
quarkus.datasource.db-kind=postgresql
# Benutzer und Passwort sind fuer die Schulung absichtlich gleich und harmlos.
quarkus.datasource.username=servicedesk
quarkus.datasource.password=servicedesk
# Port 5433, damit ein lokal installiertes Postgres auf 5432 nicht stoert.
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/servicedesk
# Die Datenbank steht schon im Container - Quarkus soll keine zweite starten.
quarkus.devservices.enabled=false

# Die Datenbank ist die Wahrheit: Hibernate prueft das Schema, aendert es aber nie.
quarkus.hibernate-orm.schema-management.strategy=validate
# Die Datenbank schreibt gemeldet_am, Java schreibt gemeldetAm - diese Zeile
# uebersetzt zwischen beiden, sonst braeuchte jedes Feld ein @Column.
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Protokoll ---

# Nur der eigene Code redet mit, der Rest bleibt auf der Voreinstellung.
quarkus.log.category."de.netzfactor".level=INFO
# Das Quarkus-Logo kostet beim Vorfuehren nur Platz auf dem Beamer.
quarkus.banner.enabled=false

# --- KI ---

# Das kleine Modell reicht fuer Zusammenfassungen und antwortet schnell genug.
quarkus.langchain4j.openai.chat-model.model-name=gpt-5.4-mini
# Ohne diese Zeile nimmt LangChain4j text-embedding-ada-002 - ein Modell, auf
# das neue OpenAI-Projekte keinen Zugriff mehr haben. 3-small liefert die 1536
# Dimensionen, die unten fuer pgvector eingestellt sind.
quarkus.langchain4j.openai.embedding-model.model-name=text-embedding-3-small
# 60 Sekunden, weil ein Aufruf ueber das Hausnetz laenger dauern darf als die Voreinstellung.
quarkus.langchain4j.openai.timeout=60s
# So viele Dimensionen liefert das Einbettungsmodell - die Tabelle ist darauf angelegt.
quarkus.langchain4j.pgvector.dimension=1536
# Der API-Schluessel steht nie in dieser Datei, sondern nur in der Umgebungsvariablen
# QUARKUS_LANGCHAIN4J_OPENAI_API_KEY.

# --- Test ---

# Im Test wird kein Modell gefragt, der Schluessel muss nur vorhanden sein.
%test.quarkus.langchain4j.openai.api-key=fuer-den-test-egal

# --- Assistent ---

# Die pgvector-Erweiterung legt ihre eigene Tabelle an - das Schema der Anwendung fasst sie nicht an.
quarkus.langchain4j.pgvector.create-table=true
# Zwanzig Nachrichten je Sitzung: genug fuer ein Gespraech, wenig genug fuer den Geldbeutel.
quarkus.langchain4j.chat-memory.memory-window.max-messages=20
# Das Handbuch liegt neben dem Modul, nicht darin - so bleibt es Inhalt und wird nicht mitgebaut.
servicedesk.handbuch.pfad=../handbuch

# Im Test wird nichts aufgenommen: ein Pfad, den es nicht gibt, ist die einfachste Bremse.
%test.servicedesk.handbuch.pfad=handbuch-gibt-es-im-test-nicht

# --- Anmeldung ---

# Formular statt Basic-Auth: nur so gibt es eine Seite, auf der man den
# Rollenunterschied sieht, statt zweier Statuscodes.
quarkus.http.auth.form.enabled=true
quarkus.http.auth.form.login-page=/anmelden
quarkus.http.auth.form.error-page=/anmelden?fehler=1
# Nach dem Anmelden dorthin, wo man hinwollte - sonst auf die Ticketliste.
quarkus.http.auth.form.landing-page=/
quarkus.http.auth.form.location-cookie=quarkus-redirect-location

# Die Anmeldeseite und ihre Ziele muessen ohne Anmeldung erreichbar sein,
# sonst schickt die Anwendung den Benutzer im Kreis.
quarkus.http.auth.permission.oeffentlich.paths=/anmelden,/abmelden,/j_security_check,/htmx.min.js
quarkus.http.auth.permission.oeffentlich.policy=permit

# Alles andere braucht eine Anmeldung. Welche Rolle wofuer reicht, steht an den
# Ressourcen selbst (@RolesAllowed) - hier steht nur, dass ueberhaupt jemand
# angemeldet sein muss.
quarkus.http.auth.permission.angemeldet.paths=/*
quarkus.http.auth.permission.angemeldet.policy=authenticated

# --- Tokenbudget ---

# Ein fester Wert je Benutzer und Tag, fuer alle gleich. Zum Vorfuehren auf 2000
# stellen: dann ist nach wenigen Fragen Schluss und die Sperre wird sichtbar.
servicedesk.assistent.tokens-pro-tag=50000

# --- Inhaltsfilter ---

# Prueft vor jedem Modellaufruf, ob die Eingabe zulaessig ist. Gefragt wird das
# Chatmodell ueber den Inhaltspruefer - kein zweiter Dienst, kein zweiter
# Zugang. Was als unzulaessig gilt, steht als Text im Prompt des Inhaltspruefer
# und laesst sich dort aendern, ohne eine Zeile Code anzufassen.
servicedesk.assistent.inhaltsfilter.aktiv=true

# Im Test wird nichts geprueft - es gibt keinen Schluessel und kein Netz.
%test.servicedesk.assistent.inhaltsfilter.aktiv=false

# --- MCP ---

# Der Client heisst "lager" - genau dieser Name steht in @McpToolBox am
# Assistenten. Ein einziger Endpunkt, Streamable HTTP, sonst nichts.
quarkus.langchain4j.mcp.lager.transport-type=streamable-http
quarkus.langchain4j.mcp.lager.url=http://localhost:8082/mcp
# Der SSE-Nebenkanal ist fuer Benachrichtigungen des Servers da. Wir fragen nur
# und lassen uns nichts erzaehlen - also aus.
quarkus.langchain4j.mcp.lager.subsidiary-channel=false
# Das Lagersystem wartet je Anfrage; 30 Sekunden sind reichlich und verhindern,
# dass ein haengender Aufruf das ganze Gespraech blockiert.
quarkus.langchain4j.mcp.lager.tool-execution-timeout=30s
# Beim Vorfuehren sehen, was zwischen Assistent und Lagersystem laeuft.
quarkus.langchain4j.mcp.lager.log-requests=true
quarkus.langchain4j.mcp.lager.log-responses=true

# Der zweite Server ist keiner von uns: die offizielle Dokumentation von
# Microsoft, oeffentlich erreichbar und ohne Anmeldung. Dieselben drei Zeilen wie
# oben - dass der eine im Nachbarfenster laeuft und der andere im Netz steht,
# aendert am Client nichts. Genau das ist der Punkt an MCP.
#
# Getestet am 28.08.2026: initialize und tools/call liefern 200, drei Werkzeuge,
# darunter microsoft_docs_search. Braucht eine Internetverbindung.
quarkus.langchain4j.mcp.wissen.transport-type=streamable-http
quarkus.langchain4j.mcp.wissen.url=https://learn.microsoft.com/api/mcp
quarkus.langchain4j.mcp.wissen.subsidiary-channel=false
# Grosszuegiger als beim Lager: die Suche geht ueber das Internet.
quarkus.langchain4j.mcp.wissen.tool-execution-timeout=60s

# Im Test laeuft kein Lagersystem und es gibt kein Netz - ohne diese Zeilen
# scheitert schon der Start, weil die Clients die Werkzeugliste abrufen wollen.
%test.quarkus.langchain4j.mcp.lager.enabled=false
%test.quarkus.langchain4j.mcp.wissen.enabled=false
