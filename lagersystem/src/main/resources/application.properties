# Ein eigener Port, damit das Lagersystem neben dem Servicedesk laufen kann.
quarkus.http.port=8082

# Kein Banner: im Kurs zaehlt die Ausgabe des Aufrufers, nicht die des Dienstes.
quarkus.banner.enabled=false

# DEBUG, damit in der Datei mehr steht als auf der Konsole - und damit beim
# Ausprobieren der Rotation ueberhaupt genug zusammenkommt.
quarkus.log.category."de.netzfactor".level=DEBUG

# --- Konsole ---------------------------------------------------------------
# Das Muster ist das von JBoss LogManager, nicht das von Log4j: %s ist die
# Nachricht, nicht %m. Der Adapter uebersetzt die API, nicht das Format.
quarkus.log.console.level=INFO
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{1.}] %s%e%n

# --- Datei mit Rotation ----------------------------------------------------
# Log4j wuerde das in einer log4j2.xml mit einem RollingFileAppender
# beschreiben. Die liest hier niemand: der Adapter gibt die Ausgabe an den
# LogManager von Quarkus weiter, und der wird ueber diese Datei eingestellt.
quarkus.log.file.enabled=true
quarkus.log.file.path=logs/lagersystem.log
quarkus.log.file.level=DEBUG
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n

# 256 KB je Datei und fuenf Altstaende: absichtlich klein, damit man die
# Rotation im Kurs auch wirklich passieren sieht. Im Betrieb waeren 10M ueblich.
quarkus.log.file.rotation.max-file-size=256K
quarkus.log.file.rotation.max-backup-index=5

# Der Datumssuffix schaltet zusaetzlich die taegliche Rotation ein: gedreht
# wird dann bei 256 KB *und* beim Tageswechsel.
quarkus.log.file.rotation.file-suffix=.yyyy-MM-dd

# Beim Start eine neue Datei anfangen - so gehoert jeder Lauf zu einem Stand.
quarkus.log.file.rotation.rotate-on-boot=true

# Wartezeit je Anfrage in Millisekunden - absichtlich so hoch, denn genau daran
# wird spaeter der Unterschied zwischen nacheinander und nebenlaeufig sichtbar.
lagersystem.verzoegerung=300

# Die Showcase-Endpunkte fuer das Profiling sind im Betrieb Sprengstoff.
# Deshalb stehen sie hinter einem Schalter, den man bewusst umlegt.
lagersystem.showcase.aktiv=true
